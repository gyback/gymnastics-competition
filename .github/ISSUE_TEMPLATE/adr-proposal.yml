name: ADR proposal
description: Raise an architecturally significant decision that needs to be made and recorded.
title: "ADR: "
labels: ["adr", "decision-needed"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for decisions that are hard to reverse or affect several parts of the system.
        See [ADR-0001](https://github.com/gyback/gymnastics-competition/blob/main/docs/adr/0001-record-architecture-decisions.md) for the process.
  - type: textarea
    id: context
    attributes:
      label: Context and problem statement
      description: What needs to be decided, and why now?
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: Decision drivers
      description: Requirements, constraints and qualities that matter for this decision.
      placeholder: "- Must ...\n- Should ..."
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to evaluate
      placeholder: "- Option A\n- Option B"
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: What must be answered before a decision can be made?
  - type: textarea
    id: related
    attributes:
      label: Depends on / related
      description: Other issues or ADRs this decision depends on or affects.
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] Options evaluated against the decision drivers
        - [ ] ADR added in `docs/adr/` (MADR format) via pull request referencing this issue
        - [ ] ADR index in `docs/adr/README.md` updated
        - [ ] Follow-up implementation issues created
